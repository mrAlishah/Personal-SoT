name: Temporary Safe Update Validation

on:
  push:
    branches:
      - feat_update_noob_one_command

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: |
          python3 -B -m unittest $(find system/tests -name 'test_*.py' | sed 's#/#.#g;s#\.py$##')
      - name: Public validation
        run: python3 -B system/validation/validate_public.py
      - name: Core validation
        run: python3 -B system/validation/validate_v1.py --mode core
      - name: Prompt validation
        run: python3 -B system/validation/validate_prompts.py
      - name: Diff check
        run: git diff --check ab181d0f7e61cb0cda7a17ef9220dbce429b30a8...HEAD
